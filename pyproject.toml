[project]
name = "samira"
version = "0.1.0"
description = "samIRA - Vigilancia epidemiológica y modelado predictivo de Infecciones Respiratorias Agudas en Puno"
readme = "README.md"
authors = [
    { name = "Aldair Maquera", email = "harperafterhours@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false
